name: Thoth Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: thoth-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  IMAGE_BASE: ttl.sh/thoth-pr-${{ github.event.pull_request.number }}

jobs:
  # ── Deploy (opened / synchronize / reopened) ─────────────────────────
  deploy:
    name: Deploy Thoth preview
    # Only deploy preview environments for PRs opened by trusted contributors
    # (repo owner/members/collaborators, per GitHub's `author_association`),
    # since the workflow builds and deploys arbitrary PR code to a real VM.
    # As a fallback (e.g. if `author_association` is ever unavailable or
    # unreliable), also explicitly allow known trusted accounts.
    if: |
      github.event.action != 'closed' &&
      (
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
        contains(fromJSON('["danships", "danshipsbot"]'), github.event.pull_request.user.login)
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check VM secrets configured
        id: check-secrets
        env:
          VM_HOST: ${{ secrets.THOTH_PREVIEW_VM_HOST }}
        run: |
          if [ -n "$VM_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ttl.sh
        run: |
          IMAGE=$(echo "${{ env.IMAGE_BASE }}:24h" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          # ttl.sh is a free, best-effort registry and occasionally returns
          # transient 502/500 errors on push, sometimes for extended periods
          # (observed outages lasting tens of minutes). Retry the whole
          # build+push with an increasing backoff so a short retry burst
          # isn't wiped out by a longer-lived registry blip, without
          # giving up too quickly.
          max_attempts=5
          attempt=1
          backoff=30
          until docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "${IMAGE}" \
            --file Dockerfile.preview \
            .
          do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::docker buildx build/push failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "::warning::docker buildx build/push failed (attempt ${attempt}/${max_attempts}), retrying in ${backoff}s..."
            attempt=$((attempt + 1))
            sleep "$backoff"
            backoff=$((backoff * 2 > 180 ? 180 : backoff * 2))
          done

      # The VM pulls the image from ttl.sh itself before running `deploy`, and that
      # free/best-effort registry occasionally drops the connection mid-layer-pull
      # (`unexpected EOF`). Retry the SSH deploy step a few times, mirroring the
      # build/push retry above, so a single flaky pull doesn't fail the whole workflow.
      - name: Deploy preview on VM (attempt 1)
        id: deploy-attempt-1
        if: steps.check-secrets.outputs.configured == 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.THOTH_PREVIEW_VM_HOST }}
          username: ${{ secrets.THOTH_PREVIEW_VM_USER }}
          key: ${{ secrets.THOTH_PREVIEW_VM_SSH_KEY }}
          timeout: 120s
          command_timeout: 10m
          script_stop: true
          script: deploy ${{ github.event.pull_request.number }} ${{ env.IMAGE }}

      - name: Wait before deploy retry
        if: steps.check-secrets.outputs.configured == 'true' && steps.deploy-attempt-1.outcome == 'failure'
        run: |
          echo "::warning::Deploy preview on VM failed (attempt 1/3), retrying in 15s..."
          sleep 15

      - name: Deploy preview on VM (attempt 2)
        id: deploy-attempt-2
        if: steps.check-secrets.outputs.configured == 'true' && steps.deploy-attempt-1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.THOTH_PREVIEW_VM_HOST }}
          username: ${{ secrets.THOTH_PREVIEW_VM_USER }}
          key: ${{ secrets.THOTH_PREVIEW_VM_SSH_KEY }}
          timeout: 120s
          command_timeout: 10m
          script_stop: true
          script: deploy ${{ github.event.pull_request.number }} ${{ env.IMAGE }}

      - name: Wait before final deploy retry
        if: steps.check-secrets.outputs.configured == 'true' && steps.deploy-attempt-1.outcome == 'failure' && steps.deploy-attempt-2.outcome == 'failure'
        run: |
          echo "::warning::Deploy preview on VM failed (attempt 2/3), retrying in 15s..."
          sleep 15

      - name: Deploy preview on VM (attempt 3)
        id: deploy-attempt-3
        if: steps.check-secrets.outputs.configured == 'true' && steps.deploy-attempt-1.outcome == 'failure' && steps.deploy-attempt-2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.THOTH_PREVIEW_VM_HOST }}
          username: ${{ secrets.THOTH_PREVIEW_VM_USER }}
          key: ${{ secrets.THOTH_PREVIEW_VM_SSH_KEY }}
          timeout: 120s
          command_timeout: 10m
          script_stop: true
          script: deploy ${{ github.event.pull_request.number }} ${{ env.IMAGE }}

      - name: Skip deploy (VM secrets not configured)
        if: steps.check-secrets.outputs.configured != 'true'
        run: |
          echo "::warning::THOTH_PREVIEW_VM_HOST secret is not configured. Skipping SSH deploy step."

      - name: Post or update preview URL comment
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const url = `https://thoth-pr-${prNumber}.preview.dbgdan.com`;
            const marker = `<!-- thoth-preview-env-${prNumber} -->`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n🚀 **Thoth preview environment**: [${url}](${url})\n_Deployed commit: \`${sha}\` — ${new Date().toUTCString()}_`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # ── Teardown (closed) ─────────────────────────────────────────────────
  teardown:
    name: Teardown Thoth preview
    # Mirror the deploy gate: only tear down previews for PRs that were
    # eligible to have one deployed in the first place.
    if: |
      github.event.action == 'closed' &&
      (
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
        contains(fromJSON('["danships", "danshipsbot"]'), github.event.pull_request.user.login)
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Check VM secrets configured
        id: check-secrets
        env:
          VM_HOST: ${{ secrets.THOTH_PREVIEW_VM_HOST }}
        run: |
          if [ -n "$VM_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove preview from VM
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.THOTH_PREVIEW_VM_HOST }}
          username: ${{ secrets.THOTH_PREVIEW_VM_USER }}
          key: ${{ secrets.THOTH_PREVIEW_VM_SSH_KEY }}
          timeout: 120s
          command_timeout: 10m
          script_stop: true
          script: teardown ${{ github.event.pull_request.number }}

      - name: Skip teardown (VM secrets not configured)
        if: steps.check-secrets.outputs.configured != 'true'
        run: |
          echo "::warning::THOTH_PREVIEW_VM_HOST secret is not configured. Skipping SSH teardown step."

      - name: Update PR comment to reflect removal
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const marker = `<!-- thoth-preview-env-${prNumber} -->`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n🗑️ **Thoth preview environment removed** (PR closed)`,
              });
            }
