name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '24.18.0'

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Run security audit
        run: pnpm audit --audit-level moderate --prod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run lint
        run: pnpm lint

      - uses: actions/cache@v6
        name: Setup nextjs cache
        with:
          # See here for caching with `yarn`, `bun` or other package managers https://github.com/actions/cache/blob/main/examples.md or you can leverage caching with actions/setup-node https://github.com/actions/setup-node
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Run build
        run: pnpm build

      # THOTH-064: build the production server exactly once here, then stage a self-contained
      # `.next/standalone` tree (+ static/public assets) that every E2E shard downloads and
      # reuses unchanged — rebuilding independently per shard would consume most of the measured
      # serving-speed gain. The staged directory intentionally excludes `.env*`, SQLite files,
      # uploads, and Playwright auth state: it is build output only, with no runtime secrets.
      - name: Stage standalone E2E server artefact
        run: |
          set -euo pipefail
          STAGE_DIR="$GITHUB_WORKSPACE/e2e-standalone-stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          cp -r .next/standalone/. "$STAGE_DIR/"
          mkdir -p "$STAGE_DIR/.next"
          cp -r .next/static "$STAGE_DIR/.next/static"
          cp -r public "$STAGE_DIR/public"

          for expected in server.js .next/BUILD_ID .next/static public; do
            if [ ! -e "$STAGE_DIR/$expected" ]; then
              echo "::error::Staged standalone artefact is missing required path: $expected" >&2
              exit 1
            fi
          done

          BUILD_ID=$(cat .next/BUILD_ID)
          LOCKFILE_HASH=$(sha256sum pnpm-lock.yaml | cut -d ' ' -f1)
          cat > "$STAGE_DIR/e2e-artefact-manifest.json" <<EOF
          {
            "commitSha": "${{ github.sha }}",
            "nodeVersion": "${{ env.NODE_VERSION }}",
            "lockfileHash": "$LOCKFILE_HASH",
            "buildId": "$BUILD_ID"
          }
          EOF

      - name: Upload standalone E2E server artefact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone-e2e
          path: e2e-standalone-stage/
          retention-days: 1
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_ENV: test
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'integration-test-secret-not-for-production' }}
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { index: 1, shard: '1/4' }
          - { index: 2, shard: '2/4' }
          - { index: 3, shard: '3/4' }
          - { index: 4, shard: '4/4' }
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_ENV: test
      DB: sqlite:///tmp/thoth-e2e.db
      STORAGE_LOCAL_FOLDER: /tmp/thoth-e2e-uploads
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'e2e-test-secret-not-for-production' }}
      SUPERSAVE_SKIP_SYNC: false
      LOG_LEVEL: error
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      # THOTH-064: run against the pre-built production server the `ci` job already produced,
      # instead of `pnpm dev`. This switch is scoped to this isolated E2E shard only — never set
      # in the build/deploy jobs above.
      PLAYWRIGHT_SERVER_MODE: standalone
      PLAYWRIGHT_STANDALONE_DIR: ${{ github.workspace }}/e2e-standalone
      E2E_TEST_AUTH_RELAXATION_ENABLED: true
      PLAYWRIGHT_BLOB_NAME: playwright-blob-${{ matrix.entry.index }}.zip

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Checkout/deps are still needed in every shard because Playwright and the seed script
      # run from source — but no shard ever runs `pnpm build`/`next build`/`pnpm dev`. The `ci`
      # job is the single build producer; all four shards download and run identical bytes.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Download standalone E2E server artefact
        uses: actions/download-artifact@v6
        with:
          name: next-standalone-e2e
          path: e2e-standalone

      - name: Verify standalone artefact matches this commit
        run: |
          set -euo pipefail
          MANIFEST="e2e-standalone/e2e-artefact-manifest.json"

          for expected in \
            "e2e-standalone/server.js" \
            "e2e-standalone/.next/BUILD_ID" \
            "e2e-standalone/.next/static" \
            "e2e-standalone/public" \
            "$MANIFEST"; do
            if [ ! -e "$expected" ]; then
              echo "::error::Downloaded standalone artefact is missing required path: $expected" >&2
              exit 1
            fi
          done

          MANIFEST_SHA=$(node -e "console.log(require('./$MANIFEST').commitSha)")
          if [ "$MANIFEST_SHA" != "${{ github.sha }}" ]; then
            echo "::error::Standalone artefact commit SHA ($MANIFEST_SHA) does not match checked-out commit (${{ github.sha }}); refusing to start this shard." >&2
            exit 1
          fi

          BUILD_ID_IN_MANIFEST=$(node -e "console.log(require('./$MANIFEST').buildId)")
          BUILD_ID_ON_DISK=$(cat e2e-standalone/.next/BUILD_ID)
          if [ "$BUILD_ID_IN_MANIFEST" != "$BUILD_ID_ON_DISK" ]; then
            echo "::error::Standalone artefact BUILD_ID mismatch between manifest ($BUILD_ID_IN_MANIFEST) and .next/BUILD_ID ($BUILD_ID_ON_DISK)." >&2
            exit 1
          fi

      - name: Run E2E tests (shard ${{ matrix.entry.shard }})
        run: pnpm test:e2e -- --shard=${{ matrix.entry.shard }}

      - name: Upload Playwright blob report (shard ${{ matrix.entry.index }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.entry.index }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: error

  merge-e2e-reports:
    runs-on: ubuntu-latest
    needs: e2e
    if: always() && needs.e2e.result != 'cancelled'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all Playwright blob reports
        uses: actions/download-artifact@v6
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge shard reports into one HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
