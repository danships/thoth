changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: '🚀 Features'
      labels:
        - feature
        - enhancement
    - title: '🐛 Bug Fixes'
      labels:
        - fix
        - bug
        - bugfix
    - title: '🔥 Hotfixes'
      labels:
        - hotfix
    - title: '📦 Dependencies'
      labels:
        - dependencies
        - deps
    - title: '📝 Documentation'
      labels:
        - documentation
        - docs
    - title: '🧰 Maintenance'
      labels:
        - chore
        - maintenance
        - ci
    - title: 'Other Changes'
      labels:
        - '*'
